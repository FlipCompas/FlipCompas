<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlipCompas – Woning Flip Calculator</title>

    <meta
        name="description"
        content="Bereken eenvoudig of een woning interessant is om te flippen. Bereken aankoopprijs, verbouwingskosten, verkoopprijs en verwachte winst met FlipCompas."
    >

    <meta name="robots" content="index, follow">

    <link
        rel="canonical"
        href="https://flipcompas.github.io/FlipCompas/"
    >

    <meta name="theme-color" content="#ffffff">

    <meta property="og:title" content="FlipCompas – Woning Flip Calculator">
    <meta
        property="og:description"
        content="Bereken eenvoudig de verwachte investering, winst en FlipScore van een woning."
    >
    <meta
        property="og:url"
        content="https://flipcompas.github.io/FlipCompas/"
    >
    <meta property="og:type" content="website">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FlipCompas",
        "url": "https://flipcompas.github.io/FlipCompas/",
        "description": "Online calculator voor het berekenen van de investering, verwachte winst en FlipScore van een woning.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "inLanguage": "nl"
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            🏠
        </div>

        <h1>FlipCompas</h1>

        <p class="subtitle">
            Bereken eenvoudig of een woning financieel interessant is.
        </p>

        <label for="minWinst">Minimale gewenste winst (€)</label>
        <input
            type="number"
            id="minWinst"
            value="15000"
            min="0"
        >

        <label for="aankoop">Aankoopprijs (€)</label>
        <input
            type="number"
            id="aankoop"
            placeholder="Bijv. 175000"
            min="0"
        >

        <label for="verbouw">Verbouwkosten (€)</label>
        <input
            type="number"
            id="verbouw"
            placeholder="Bijv. 35000"
            min="0"
        >

        <label for="verkoop">Verwachte verkoopprijs (€)</label>
        <input
            type="number"
            id="verkoop"
            placeholder="Bijv. 265000"
            min="0"
        >

        <label for="overdracht">Overdrachtsbelasting (%)</label>

        <input
            type="number"
            id="overdracht"
            value="2"
            min="0"
            step="0.1"
        >

        <button type="button" onclick="bereken()">
            📈 Bereken deal
        </button>

        <div id="resultaat">
            Vul de gegevens in en bereken je deal.
        </div>

        <div class="dashboard">

            <div class="kaart">
                <h3>💰 Totale investering</h3>
                <p id="investering">€ 0</p>
            </div>

            <div class="kaart">
                <h3>📈 Verwachte winst</h3>
                <p id="winstKaart">€ 0</p>
            </div>

            <div class="kaart">
                <h3>⭐ FlipScore</h3>
                <p id="flipscore">0 / 100</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
